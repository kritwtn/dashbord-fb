# Auto-deploy to Firebase Hosting on every push to main.
# Needs repository secret FIREBASE_SERVICE_ACCOUNT_DASHBOARD_REELS_87E0B (created by `firebase init hosting:github`;
# a service account with Firebase Hosting Admin on project dashboard-reels-87e0b).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the version number is the commit count
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DASHBOARD_REELS_87E0B }}
          projectId: dashboard-reels-87e0b
          channelId: live
